cmake_minimum_required(VERSION 3.22)
project(SystemTUV_PythonInterpreter C)

set(CMAKE_C_STANDARD 11)
set(CMAKE_C_STANDARD_REQUIRED ON)

# Das unumstößliche SystemTUV DLC Manifest global injizieren
add_definitions(-DSYSTEM_DLC_MANIFEST="2fe9fc84431b4369d35cfdb3482920ebe7de1375")

# Python-Entwicklungsumgebung auf dem Host finden (für die Einbettung und den Interpreter-Build)
find_package(Python3 REQUIRED COMPONENTS Development Interpreter)

include_directories(${Python3_INCLUDE_DIRS})

# Optimierungsflags für maximale Performance des Interpreters
if(CMAKE_C_COMPILER_ID MATCHES "Clang|GNU")
    add_compile_options(-O3 -Wall -Wextra -fno-stack-protector)
endif()

# Der angepasste Python-Interpreter Core
add_executable(tuv_python
    src/tuv_py_main.c
    src/tuv_hypervisor_hooks.c
)

# Verknüpfung mit der lokalen Python-Bibliothek und dem Partner-Krypto-Code (falls vorhanden)
target_link_libraries(tuv_python PRIVATE Python3::Python)

message(STATUS "[SystemTUV] CMake für modifizierten Python-Interpreter konfiguriert.")
message(STATUS "[SystemTUV] Aktiver Python-Pfad: ${Python3_EXECUTABLE}")
message(STATUS "[SystemTUV] Aktives DLC-Manifest: 2fe9fc84431b4369d35cfdb3482920ebe7de1375")
